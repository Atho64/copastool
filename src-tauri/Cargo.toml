[package]
name = "copas-tool"
version = "0.1.14-beta.3"
description = "Copas Tool Desktop and Mobile App"
authors = ["atho"]
edition = "2021"

[lib]
name = "copas_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
url = "2"
# Native Camoufox Auto Copas driver: WebDriver BiDi over WebSocket + zip extract.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Game Engine workspace. All of these are used only by `engine/`.
regex = "1"
walkdir = "2"
sha1 = "0.10"          # PFS data key (SHA-1 of the index); pure Rust
flate2 = "1"           # zlib for XP3 indexes and segments; miniz backend, Android-safe
emote-psb = "0.8"      # PSB/MDF scenario read and write; replaces FreeMote

# Win32 window management for the VN overlay: the overlay has to win the z-order
# fight against a fullscreen game, which needs SetWindowPos + DWM info that the
# cross-platform windowing layer does not expose.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

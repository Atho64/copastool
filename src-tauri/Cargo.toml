[package]
name = "copas-tool"
version = "0.1.14-beta.2"
description = "Copas Tool Desktop and Mobile App"
authors = ["atho"]
edition = "2021"

[lib]
name = "copas_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Native Camoufox Auto Copas driver: WebDriver BiDi over WebSocket + zip extract.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Win32 window management for the VN overlay: the overlay has to win the z-order
# fight against a fullscreen game, which needs SetWindowPos + DWM info that the
# cross-platform windowing layer does not expose.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

name: Build & Release (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Superseded runs of the same ref are cancelled so caches and runners stay free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  # Cheap gate: package.json is the single source of truth for the version and every
  # other marker (tauri.conf.json, Cargo.toml, Cargo.lock, README badge, frontend)
  # must agree with it before anything is built.
  version-check:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check version markers
        run: npm run version:check

      - name: Check release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v$pkg_version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v$pkg_version"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json v$pkg_version"

  build-windows:
    name: Build Windows (NSIS + MSI)
    needs: version-check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Caches the Cargo registry, git dependencies and src-tauri/target — the
      # single biggest CI time saver for this workflow.
      - name: Cache Rust build (Windows)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: windows

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopasTool-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    name: Build Android (APK)
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk 2>/dev/null)" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "Using NDK at $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      # Rust + Gradle caches — the Android job is by far the slowest one here.
      - name: Cache Rust build (Android)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android
          cache-all-crates: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Initialize Android project
        run: |
          npx tauri android init --ci --skip-targets-install || true
          node scripts/patch-android-overlay.mjs

      # gen/ is gitignored and `tauri android init` scaffolds the DEFAULT Tauri
      # template launcher icons into it. `tauri icon` writes the real launcher
      # mipmaps (from icons-src/icon.png, the tracked 1024x1024 master) directly
      # into the generated Android project, so it must run after init and before
      # the build — otherwise the published APK ships with the default Tauri icon.
      - name: Regenerate Android launcher icons
        run: npx tauri icon ./icons-src/icon.png

      - name: Build Android APK
        run: npm run tauri android build -- --apk --ci --target aarch64 --target armv7 --target x86_64

      - name: Sign & Align Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools at $BUILD_TOOLS_DIR"

          KEYSTORE="$RUNNER_TEMP/copastool-release.jks"

          # The release keystore comes from repository secrets, so a new APK can update an
          # already installed CopasTool. A throwaway keystore is generated only as a fallback
          # to keep the workflow green — artifacts signed with it cannot update an install.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            # tr strips stray CR/LF/spaces that can sneak in when a secret value is pasted.
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 --decode > "$KEYSTORE"
            ALIAS="${ANDROID_KEY_ALIAS:-copastool}"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            # Fail fast (before the long build) if keystore, password and alias do not match.
            if ! keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1; then
              echo "::error::Keystore/password/alias tidak cocok. Periksa ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, dan ANDROID_KEY_ALIAS."
              exit 1
            fi
            echo "Signing with the release keystore from repository secrets (alias: $ALIAS)."
          else
            ALIAS="copastool"
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$STORE_PASS"
            echo "::warning title=Ephemeral signing key::ANDROID_KEYSTORE_BASE64 is not configured, so a throwaway keystore was generated. APKs from this run cannot update an already installed CopasTool. See README -> Android Release Signing."
            keytool -genkeypair -v -keystore "$KEYSTORE" -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=CopasTool, OU=Mobile, O=CopasTool, L=Jakarta, S=Indonesia, C=ID"
          fi
          
          mkdir -p signed-apk
          
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            echo "Processing APK: $apk"
            base=$(basename "$apk" .apk)
            
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "signed-apk/${base}-aligned.apk" || cp "$apk" "signed-apk/${base}-aligned.apk"
            
            $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE" --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --out "signed-apk/${base}-signed.apk" "signed-apk/${base}-aligned.apk"
            
            $BUILD_TOOLS_DIR/apksigner verify "signed-apk/${base}-signed.apk"
            rm -f "signed-apk/${base}-aligned.apk"
          done
          
          if [ -f "signed-apk/app-universal-release-unsigned-signed.apk" ]; then
            mv "signed-apk/app-universal-release-unsigned-signed.apk" "signed-apk/CopasTool_universal.apk"
          fi
          
          echo "Signed APKs:"
          ls -la signed-apk/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopasTool-Android-APK
          if-no-files-found: error
          path: signed-apk/*.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CopasTool-Windows
          path: release-assets/windows

      - name: Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CopasTool-Android-APK
          path: release-assets/android

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.apk" \) -exec cp {} release-files/ \;
          echo "Files to be released:"
          ls -lh release-files/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*

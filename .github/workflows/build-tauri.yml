name: Build & Release (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopasTool-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk 2>/dev/null)" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "Using NDK at $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize & Build Android APK
        run: |
          npx tauri android init --ci --skip-targets-install || true
          npm run tauri android build -- --apk --ci --target aarch64 --target armv7 --target x86_64

      - name: Sign & Align Android APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools at $BUILD_TOOLS_DIR"
          
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias copastool -storepass copastool123 -keypass copastool123 \
            -dname "CN=CopasTool, OU=Mobile, O=CopasTool, L=Jakarta, S=Indonesia, C=ID"
          
          mkdir -p signed-apk
          
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            echo "Processing APK: $apk"
            base=$(basename "$apk" .apk)
            
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "signed-apk/${base}-aligned.apk" || cp "$apk" "signed-apk/${base}-aligned.apk"
            
            $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:copastool123 --key-pass pass:copastool123 \
              --out "signed-apk/${base}-signed.apk" "signed-apk/${base}-aligned.apk"
            
            $BUILD_TOOLS_DIR/apksigner verify "signed-apk/${base}-signed.apk"
            rm -f "signed-apk/${base}-aligned.apk"
          done
          
          if [ -f "signed-apk/app-universal-release-unsigned-signed.apk" ]; then
            cp "signed-apk/app-universal-release-unsigned-signed.apk" "signed-apk/CopasTool_universal.apk"
          fi
          
          echo "Signed APKs:"
          ls -la signed-apk/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopasTool-Android-APK
          path: signed-apk/*.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CopasTool-Windows
          path: release-assets/windows

      - name: Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CopasTool-Android-APK
          path: release-assets/android

      - name: Prepare Release Assets
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.apk" \) -exec cp {} release-files/ \;
          echo "Files to be released:"
          ls -lh release-files/

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*

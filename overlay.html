<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CopasTool VN Overlay</title>
  <link rel="stylesheet" href="./src/overlay.css">
</head>
<body class="overlay-body">
  <div class="overlay-shell" id="overlayShell">
    <!-- Drag region. Kept deliberately thin: the overlay exists to show
         dialogue, so chrome gets the smallest possible footprint. -->
    <header class="ov-bar" id="overlayHeader" data-tauri-drag-region>
      <span class="ov-dot" id="statusDot" data-tauri-drag-region title="LunaTranslator: terputus"></span>

      <span class="ov-file" id="overlayTitle" data-tauri-drag-region>VN Overlay</span>

      <span class="ov-meta" id="overlayMeta" data-tauri-drag-region>
        <span class="ov-counter" id="lineBadge">--/--</span>
        <span class="ov-sep" aria-hidden="true">·</span>
        <span class="ov-mode" id="modeBadge">CHECK</span>
      </span>

      <span class="ov-spacer" data-tauri-drag-region></span>

      <button type="button" class="ov-btn ov-btn-pin" id="btnInteractive" title="Mode interaktif: klik, geser, dan tombol aktif" aria-label="Ubah mode interaktif" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5"/>
          <path d="M9 10.76a4 4 0 0 1 6 0"/>
          <path d="M5 10.76a8 8 0 0 1 14 0"/>
        </svg>
      </button>

      <button type="button" class="ov-btn" id="btnOpacity" title="Transparansi latar (85% → 60% → 35% → 100%)" aria-label="Ubah transparansi">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/>
        </svg>
      </button>

      <button type="button" class="ov-btn ov-btn-close" id="btnClose" title="Tutup overlay" aria-label="Tutup overlay">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </header>

    <main class="ov-body" id="overlayContent">
      <!-- Previous lines: dim, single-line, purely for orientation -->
      <div class="ov-ctx ov-ctx-prev" id="prevLinesContainer"></div>

      <article class="ov-active" id="activeLineCard">
        <div class="ov-active-head">
          <span class="ov-speaker" id="activeSpeaker" style="display: none;"></span>
          <span class="ov-tag" id="activeFile"></span>
          <button type="button" class="ov-star" id="btnBookmark" title="Tandai baris ini" aria-label="Bookmark baris">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
              <polygon points="12 3 15 9.2 22 10.2 17 15 18.2 22 12 18.6 5.8 22 7 15 2 10.2 9 9.2 12 3"/>
            </svg>
          </button>
        </div>

        <p class="ov-trans" id="activeTranslated">Menunggu dialog…</p>

        <div class="ov-source">
          <p class="ov-orig" id="activeOriginal"></p>
          <p class="ov-romaji" id="activeRomaji" style="display: none;"></p>
        </div>
      </article>

      <!-- Next lines -->
      <div class="ov-ctx ov-ctx-next" id="nextLinesContainer"></div>
    </main>
  </div>

  <script type="module" src="./src/overlay.ts"></script>
</body>
</html>
